[project]
name = "alp"
version = "0.1.0"
description = "Agent Lexicon Protocol (RFC-ALP-001) reference toolkit: ALP/B codec, ALP/T text form, English conversion, PNG/PDF rendering"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "reportlab>=4.0",
]

[project.scripts]
alp = "alp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
